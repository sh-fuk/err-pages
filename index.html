<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error Page Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #fafafa; --surface: #fff; --text: #313131; --strong: #171717; --muted: #737373;
    --border: #e5e5e5; --hover: #f5f5f5; --active: #ededed;
    --primary: #0051c3; --primary-hover: #003681; --primary-text: #fff; --focus: #0051c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --surface: #141414; --text: #d4d4d4; --strong: #fafafa; --muted: #a3a3a3;
      --border: #262626; --hover: #1c1c1c; --active: #262626;
      --primary: #4693ff; --primary-hover: #73adff; --primary-text: #0a0a0a; --focus: #4693ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/21px Inter, ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 320px 1fr; height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* 左パネル */
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .brand { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--strong); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .brand svg { flex: none; }
  .nav { padding: 8px 8px 10px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 2px; }
  .nav h2 { grid-column: 1 / -1; font-size: 12px; font-weight: 500; color: var(--muted); margin: 8px 8px 2px; }
  .nav h2:first-child { margin-top: 0; }
  .nav button {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; font-size: 13px;
    border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; color: var(--text); font-weight: 500;
  }
  .nav button svg { flex: none; }
  .nav button:hover { background: var(--hover); }
  .nav button.active { background: var(--active); color: var(--strong); }
  .panel .foot { margin-top: auto; padding: 10px 12px; font-size: 11px; line-height: 16px; color: var(--muted); border-top: 1px solid var(--border); }

  .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .section h3 { font-size: 13px; font-weight: 600; color: var(--strong); margin: 0 0 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--strong); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; height: 32px; padding: 0 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
  }
  .field textarea { height: auto; min-height: 72px; padding: 6px 10px; line-height: 19px; resize: vertical; }
  .field :is(input, select, textarea):focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  .btn {
    height: 28px; padding: 0 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .actions { display: flex; gap: 4px; }
  .actions .btn { flex: 1; padding: 0 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .link { border: 0; background: none; padding: 0; color: var(--primary); font-size: 12px; font-weight: 500; cursor: pointer; }
  .link:hover { text-decoration: underline; }

  /* プレビュー */
  .preview { min-width: 0; display: flex; padding: 12px; }
  iframe { flex: 1; border: 1px solid var(--border); border-radius: 8px; background: #fff; width: 100%; }

  .toast {
    position: fixed; left: 336px; bottom: 16px; background: var(--strong); color: var(--surface);
    padding: 8px 12px; border-radius: 6px; font-weight: 500; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; }
    .panel { border-right: 0; border-bottom: 1px solid var(--border); overflow: visible; }
    .nav { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .panel .foot { display: none; }
    .toast { left: 16px; }
  }
</style>
</head>
<body>
<aside class="panel">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 7h15M7.5 10.5l5 4M12.5 10.5l-5 4"/></svg>
    Error Pages
  </div>
  <div class="section nav" id="services"></div>
  <div class="section">
    <div class="actions">
      <button class="btn primary" id="openBtn">開く</button>
      <button class="btn" id="downloadBtn">保存</button>
      <button class="btn" id="copyBtn">コピー</button>
      <button class="btn" id="shareBtn">共有</button>
    </div>
  </div>
  <div class="section" id="presetSection">
    <h3>プリセット</h3>
    <div class="presets" id="presets"></div>
  </div>
  <div class="section">
    <h3 class="row">内容<button class="link" id="resetBtn">リセット</button></h3>
    <form id="form" autocomplete="off"></form>
  </div>
  <div class="foot">商標は各社に帰属します。</div>
</aside>
<main class="preview">
  <iframe id="preview" title="preview"></iframe>
</main>
<div class="toast" id="toast"></div>

<script src="assets.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
const paras = s => String(s ?? "").split(/\n{2,}/).map(p => `<p>${nl(p)}</p>`).join("");
const A = window.ASSETS;

const TEMPLATES = {
  google: {
    name: "Google",
    fields: [
      { key: "code", label: "エラーコード", value: "404" },
      { key: "status", label: "ステータス名 (タブ用)", value: "Not Found" },
      { key: "lead", label: "灰色の一言", value: "That’s an error." },
      { key: "path", label: "URLパス", value: "/abcdef" },
      { key: "message", label: "本文 ({path} がパスに置換)", value: "The requested URL {path} was not found on this server.", type: "textarea" },
      { key: "tail", label: "締めの一言", value: "That’s all we know." },
    ],
    presets: {
      "500": { code: "500", status: "Internal Server Error", message: "The server encountered an error and could not complete your request.", tail: "Please try again in 30 seconds." },
      "400": { code: "400", status: "Bad Request", message: "Your client has issued a malformed or illegal request.", tail: "That’s all we know." },
      "418": { code: "418", status: "I'm a Teapot", lead: "I’m a teapot.", message: "The requested entity body is short and stout.", tail: "Tip me over and pour me out." },
    },
    render: v => `<!DOCTYPE html>
<html lang=en>
  <meta charset=utf-8>
  <meta name=viewport content="initial-scale=1, minimum-scale=1, width=device-width">
  <title>Error ${esc(v.code)} (${esc(v.status)})!!1</title>
  <style>
    *{margin:0;padding:0}html,code{font:15px/22px arial,sans-serif}html{background:#fff;color:#222;padding:15px}body{margin:7% auto 0;max-width:390px;min-height:180px;padding:30px 0 15px}* > body{background:url(${A.googleRobot}) 100% 5px no-repeat;padding-right:205px}p{margin:11px 0 22px;overflow:hidden}ins{color:#777;text-decoration:none}a img{border:0}@media screen and (max-width:772px){body{background:none;margin-top:0;max-width:none;padding-right:0}}#logo{background:url(${A.googleLogo}) no-repeat 0% 0%/100% 100%;margin-left:-5px}#logo{display:inline-block;height:54px;width:150px}
  </style>
  <a href=//www.google.com/><span id=logo aria-label=Google></span></a>
  <p><b>${esc(v.code)}.</b> <ins>${esc(v.lead)}</ins>
  <p>${esc(v.message).replace("{path}", `<code>${esc(v.path)}</code>`)}  <ins>${esc(v.tail)}</ins>
</html>`,
  },

  github: {
    name: "GitHub",
    fields: [
      { key: "code", label: "大きな文字 (イラスト左上)", value: "404" },
      { key: "heading", label: "吹き出しの文言", value: "This is not the web page you are looking for." },
      { key: "label", label: "検索欄のラベル", value: "Find code, projects, and people on GitHub:" },
      { key: "title", label: "タブのタイトル", value: "Page not found · GitHub · GitHub" },
    ],
    presets: {
      "500": { code: "500", heading: "Looks like something went wrong!", title: "Server Error · GitHub" },
      "日本語": { heading: "お探しのページは見つかりませんでした。", label: "GitHub でコード・プロジェクト・ユーザーを検索:" },
    },
    render: v => {
      const code = String(v.code);
      // 実物のイラストから焼き込みの文字パスだけを除去し、編集可能なテキストを重ねている
      const overlay = `
<text x="128" y="96" text-anchor="middle" font-family="'Mona Sans','Mona Sans VF',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="118" font-weight="800" fill="#FDFDFD" stroke="#E4E7EB" stroke-width="1.5" paint-order="stroke"${code.length <= 3 ? ` textLength="227" lengthAdjust="spacingAndGlyphs"` : ""}>${esc(code)}</text>
<foreignObject x="14" y="108" width="236" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font:700 22px/1.25 'Mona Sans','Mona Sans VF',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#33607A;overflow:hidden;word-break:break-word">${esc(v.heading)}</div></foreignObject>`;
      const illus = A.ghIllus.replace(/<svg /, `<svg class="d-block width-full" style="height:auto;position:relative;top:50%;transform:translateY(-50%);width:100%" role="img" aria-label="${esc(code)} “${esc(v.heading)}”" `).replace(/<\/svg>\s*$/, overlay + "</svg>");
      const chev = `<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="opacity:.5;margin-left:2px;vertical-align:-3px"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>`;
      return `<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>${esc(v.title)}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Mona Sans","Mona Sans VF",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#1f2328;background:#fff}
a{color:inherit;text-decoration:none}
header{background:#000;color:#fff;padding:16px 0;height:72px}
.hd{max-width:1280px;margin:0 auto;padding:0 32px;display:flex;align-items:center;height:40px;gap:16px}
.hd nav{display:flex;gap:4px;font-size:16px;font-weight:500;margin-left:8px}.hd nav span{padding:8px;white-space:nowrap}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:16px}
.hd .r .up{border:1px solid #fff;border-radius:6px;padding:3px 8px}
.hero{position:relative;z-index:0;--not-found-height:clamp(clamp(240px,calc(100vw - 280px),370px),min(56.3vw,calc(100dvh - 390px)),529px)}
.hero .bg{position:absolute;overflow:hidden;width:100%;top:0;left:0;height:var(--not-found-height)}
.hero .bg img{position:absolute;inset:0;z-index:1;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center 48%}
.hero .fg{position:relative;width:100%;margin:0 auto;overflow:hidden;z-index:2;max-width:806px;padding:0 8px;height:var(--not-found-height)}
.below{max-width:1012px;margin:20px auto 0;padding:0 16px 32px}
label{display:block;color:#59636e;font-size:16px;margin-bottom:4px}
.row{display:flex;align-items:center}
input{flex:auto;font:inherit;font-size:16px;padding:5px 12px;height:32px;border:1px solid #d1d9e0;border-radius:6px;margin-right:8px;color:#1f2328}
button{font:inherit;font-weight:500;color:#25292e;background:#f6f8fa;border:1px solid #d1d9e0;border-radius:6px;padding:5px 16px;height:32px}
.links{margin-top:20px;color:#59636e;text-align:center}.links a{color:#59636e}
@media(max-width:1011px){.hd nav{display:none}}
</style></head>
<body>
<header><div class="hd">
<svg height="32" viewBox="0 0 24 24" width="32" fill="#fff"><path d="M12 1C5.923 1 1 5.923 1 12c0 4.867 3.149 8.979 7.521 10.436.55.096.756-.233.756-.522 0-.262-.013-1.128-.013-2.049-2.764.509-3.479-.674-3.699-1.292-.124-.317-.66-1.293-1.127-1.554-.385-.207-.936-.715-.014-.729.866-.014 1.485.797 1.691 1.128.99 1.663 2.571 1.196 3.204.907.096-.715.385-1.196.701-1.471-2.448-.275-5.005-1.224-5.005-5.432 0-1.196.426-2.186 1.128-2.956-.111-.275-.496-1.402.11-2.915 0 0 .921-.288 3.024 1.128a10.193 10.193 0 0 1 2.75-.371c.936 0 1.871.123 2.75.371 2.104-1.43 3.025-1.128 3.025-1.128.605 1.513.221 2.64.111 2.915.701.77 1.127 1.747 1.127 2.956 0 4.222-2.571 5.157-5.019 5.432.399.344.743 1.004.743 2.035 0 1.471-.014 2.654-.014 3.025 0 .289.206.632.756.522C19.851 20.979 23 16.854 23 12c0-6.077-4.922-11-11-11Z"/></svg>
<nav><span>Platform${chev}</span><span>Solutions${chev}</span><span>Resources${chev}</span><span>Open Source${chev}</span><span>Enterprise${chev}</span><span>Pricing</span></nav>
<div class="r"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg><a href="#">Sign in</a><a class="up" href="#">Sign up</a></div>
</div></header>
<main class="font-mktg">
<div class="hero">
  <div class="bg"><img alt="" src="${A.ghBg}"></div>
  <div class="fg">${illus}</div>
</div>
<div class="below">
  <form onsubmit="return false"><label for="not-found-search">${esc(v.label)}</label>
  <div class="row"><input type="text" id="not-found-search"><button type="submit">Search</button></div></form>
  <div class="links"><a href="#">Contact Support</a> &mdash; <a href="#">GitHub Status</a> &mdash; <a href="#">@githubstatus</a></div>
</div>
</main>
</body></html>`;
    },
  },

  cloudflare: {
    name: "Cloudflare",
    fields: [
      { key: "title", label: "見出し", value: "Web server is down" },
      { key: "code", label: "エラーコード", value: "521" },
      { key: "time", label: "日時", value: "" },
      { key: "broken", label: "どこがエラー?", value: "host", type: "select", options: ["host", "cloudflare", "browser", "none", "all"] },
      { key: "youLabel", label: "左: 場所", value: "You" },
      { key: "cfLabel", label: "中央: Cloudflare拠点", value: "Tokyo" },
      { key: "hostLabel", label: "右: ホスト名", value: "example.com" },
      { key: "what", label: "What happened? (空行で段落)", value: "The web server is not returning a connection. As a result, the web page is not displaying.", type: "textarea" },
      { key: "todo", label: "What can I do? (空行で段落)", value: "If you are a visitor of this website:\nPlease try again in a few minutes.\n\nIf you are the owner of this website:\nContact your hosting provider letting them know your web server is not responding.", type: "textarea" },
      { key: "ray", label: "Ray ID", value: "" },
      { key: "ip", label: "Your IP (クリックで表示)", value: "203.0.113.42" },
    ],
    presets: {
      "500": { title: "Internal server error", code: "500", broken: "cloudflare", what: "There is an internal server error on Cloudflare's network.", todo: "Please try again in a few minutes." },
      "502": { title: "Bad gateway", code: "502", broken: "host", what: "The web server reported a bad gateway error.", todo: "Please try again in a few minutes." },
      "522": { title: "Connection timed out", code: "522", broken: "host", what: "The initial connection between Cloudflare's network and the origin web server timed out. As a result, the web page can not be displayed.", todo: "If you're a visitor of this website:\nPlease try again in a few minutes.\n\nIf you're the owner of this website:\nContact your hosting provider letting them know your web server is not completing requests." },
      "524": { title: "A timeout occurred", code: "524", broken: "host", what: "The origin web server timed out responding to this request.", todo: "If you're a visitor of this website:\nPlease try again in a few minutes.\n\nIf you're the owner of this website:\nThe connection to the origin web server was made, but the origin web server timed out before responding." },
      "全滅": { title: "Everything is on fire", code: "999", broken: "all", what: "Literally everything is broken.", todo: "Go outside. Touch grass." },
    },
    init: v => {
      if (!v.time) v.time = new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC";
      if (!v.ray) v.ray = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, "0")).join("");
    },
    render: v => {
      const items = [
        ["browser", "browser", v.youLabel, "Browser"],
        ["cloudflare", "cloud", v.cfLabel, "Cloudflare"],
        ["host", "server", v.hostLabel, "Host"],
      ].map(([id, icon, loc, name]) => {
        const bad = v.broken === "all" || v.broken === id;
        return `<div id="cf-${id}-status" class="${v.broken === id ? "cf-error-source" : ""} relative w-1/3 md:w-full py-15 md:p-0 md:py-8 md:text-left md:border-solid md:border-0 md:border-b md:border-gray-400 overflow-hidden float-left md:float-none text-center">
  <div class="relative mb-10 md:m-0">
    <span class="cf-icon-${icon} block md:hidden h-20 bg-center bg-no-repeat"></span>
    <span class="cf-icon-${bad ? "error" : "ok"} w-12 h-12 absolute left-1/2 md:left-auto md:right-0 md:top-0 -ml-6 -bottom-4"></span>
  </div>
  <span class="md:block w-full truncate">${esc(loc)}</span>
  <h3 class="md:inline-block mt-3 md:mt-0 text-2xl text-gray-600 font-light leading-1.3"${name === "Cloudflare" ? ' style="color: #2f7bbf;"' : ""}>${name}</h3>
  <span class="leading-1.3 text-2xl" style="color: ${bad ? "#bd2426" : "#9bca3e"}">${bad ? "Error" : "Working"}</span>
</div>`;
      }).join("\n");
      return `<!DOCTYPE html>
<!--[if lt IE 7]> <html class="no-js ie6 oldie" lang="en-US"> <![endif]-->
<!--[if IE 7]>    <html class="no-js ie7 oldie" lang="en-US"> <![endif]-->
<!--[if IE 8]>    <html class="no-js ie8 oldie" lang="en-US"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en-US"> <!--<![endif]-->
<head>
<title>${esc(v.hostLabel)} | ${esc(v.code)}: ${esc(v.title)}</title>
<meta charset="UTF-8" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=Edge" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>${A.cfCss}</style>
</head>
<body>
<div id="cf-wrapper">
  <div id="cf-error-details" class="p-0">
    <header class="mx-auto pt-10 lg:pt-6 lg:px-8 w-240 lg:w-full mb-8">
      <h1 class="inline-block sm:block sm:mb-2 font-light text-60 lg:text-4xl text-black-dark leading-tight mr-2">
        <span class="inline-block">${esc(v.title)}</span>
        <span class="code-label">Error code ${esc(v.code)}</span>
      </h1>
      <div>Visit <a href="https://www.cloudflare.com/" target="_blank" rel="noopener noreferrer">cloudflare.com</a> for more information.</div>
      <div class="mt-3">${esc(v.time)}</div>
    </header>
    <div class="my-8 bg-gradient-gray">
      <div class="w-240 lg:w-full mx-auto">
        <div class="clearfix md:px-8">
${items}
        </div>
      </div>
    </div>
    <div class="w-240 lg:w-full mx-auto mb-8 lg:px-8">
      <div class="clearfix">
        <div class="w-1/2 md:w-full float-left pr-6 md:pb-10 md:pr-0 leading-relaxed">
          <h2 class="text-3xl font-normal leading-1.3 mb-4">What happened?</h2>
          ${paras(v.what)}
        </div>
        <div class="w-1/2 md:w-full float-left leading-relaxed">
          <h2 class="text-3xl font-normal leading-1.3 mb-4">What can I do?</h2>
          ${paras(v.todo)}
        </div>
      </div>
    </div>
    <div class="cf-error-footer cf-wrapper w-240 lg:w-full py-10 sm:py-4 sm:px-8 mx-auto text-center sm:text-left border-solid border-0 border-t border-gray-300">
      <p class="text-13">

const $ = id => document.getElementById(id);
let current = "google";
let values = {};

function defaults(key) {
  const t = TEMPLATES[key];
  const v = Object.fromEntries(t.fields.map(f => [f.key, f.value]));
  t.init?.(v);
  return v;
}

function selectService(key, initial) {
  current = key;
  values = { ...defaults(key), ...(initial || {}) };
  document.querySelectorAll("#services button").forEach(b => b.classList.toggle("active", b.dataset.key === key));
  buildForm();
  buildPresets();
  render();
}

function buildForm() {
  const t = TEMPLATES[current];
  $("form").innerHTML = t.fields.map(f => {
    const id = "f_" + f.key;
    let input;
    if (f.type === "textarea") input = `<textarea id="${id}" data-key="${f.key}">${esc(values[f.key])}</textarea>`;
    else if (f.type === "select") input = `<select id="${id}" data-key="${f.key}">${f.options.map(o => `<option${o === values[f.key] ? " selected" : ""}>${o}</option>`).join("")}</select>`;
    else input = `<input id="${id}" data-key="${f.key}" value="${esc(values[f.key])}">`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
  }).join("");
}

function buildPresets() {
  const p = TEMPLATES[current].presets || {};
  $("presets").innerHTML = Object.keys(p).map(k => `<button class="btn" data-preset="${esc(k)}">${esc(k)}</button>`).join("");
  $("presetSection").hidden = !Object.keys(p).length;
}

function html() { return TEMPLATES[current].render(values); }

let raf;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const out = html();
    $("preview").srcdoc = out;
  });
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1400);
}

const NAV = [
  ["サービス", ["google", "github", "cloudflare", "discord", "microsoft"]],
  ["Webサーバー", ["iis", "nginx", "apache"]],
];
$("services").innerHTML = NAV.map(([title, keys]) =>
  `<h2>${title}</h2>` + keys.map(k => `<button data-key="${k}">${LOGOS[k]}${esc(TEMPLATES[k].name)}</button>`).join("")).join("");
$("services").addEventListener("click", e => { const k = e.target.closest("button")?.dataset.key; if (k) selectService(k); });
$("form").addEventListener("input", e => { const k = e.target.dataset.key; if (k) { values[k] = e.target.value; render(); } });
$("presets").addEventListener("click", e => {
  const k = e.target.dataset.preset; if (!k) return;
  Object.assign(values, TEMPLATES[current].presets[k]); buildForm(); render();
});
$("openBtn").onclick = () => {
  const url = URL.createObjectURL(new Blob([html()], { type: "text/html" }));
  window.open(url, "_blank");
};
$("downloadBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html()], { type: "text/html" }));
  a.download = `${current}-${values.code || "error"}.html`;
  a.click();
};
$("copyBtn").onclick = async () => { await navigator.clipboard.writeText(html()); toast("HTMLをコピーしました"); };
$("resetBtn").onclick = () => selectService(current);
$("shareBtn").onclick = async () => {
  const data = btoa(unescape(encodeURIComponent(JSON.stringify({ s: current, v: values }))));
  const url = location.href.split("#")[0] + "#" + data;
  history.replaceState(null, "", "#" + data);
  await navigator.clipboard.writeText(url); toast("共有URLをコピーしました");
};

// URLハッシュから状態を復元
(() => {
  try {
    const { s, v } = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    if (TEMPLATES[s]) return selectService(s, v);
  } catch {}
  selectService("google");
})();
</script>
</body>
</html>
